<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Billing Sender</title>
    <style>
      :root {
        font-family: Arial, sans-serif;
      }
      body {
        margin: 0;
        padding: 2rem;
        background: #f7f8fa;
      }
      .card {
        max-width: 480px;
        margin: 0 auto;
        background: #fff;
        padding: 1.25rem;
        border-radius: 10px;
        box-shadow: 0 3px 14px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin-top: 0;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.35rem;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 0.7rem;
        border: 1px solid #ccd2dc;
        border-radius: 6px;
        margin-bottom: 0.9rem;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 6px;
        background: #25d366;
        color: #fff;
        font-size: 1rem;
        font-weight: 700;
        padding: 0.85rem;
        cursor: pointer;
      }
      button:hover {
        background: #1fae54;
      }
      .hint {
        color: #5f6773;
        margin-top: 0.8rem;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Send Bill via WhatsApp</h1>

      <label for="customerNumber">Customer Number</label>
      <input id="customerNumber" type="tel" placeholder="e.g. 628123456789" />

      <label for="billLink">Bill Link</label>
      <input id="billLink" type="url" placeholder="https://example.com/bills/INV-001" />

      <button id="sendBillButton" type="button">Send Bill</button>
      <p class="hint">This opens a wa.me link in a new tab. No WhatsApp API integration is used.</p>
    </main>

    <script>
      const customerNumberInput = document.getElementById('customerNumber');
      const billLinkInput = document.getElementById('billLink');
      const sendBillButton = document.getElementById('sendBillButton');

      sendBillButton.addEventListener('click', () => {
        const customerNumber = customerNumberInput.value.replace(/\D/g, '');
        const billLink = billLinkInput.value.trim();

        if (!customerNumber || !billLink) {
          alert('Please enter both customer number and bill link.');
          return;
        }

        const message = encodeURIComponent(`Hello, here is your bill: ${billLink}`);
        const waLink = `https://wa.me/${customerNumber}?text=${message}`;

        window.open(waLink, '_blank', 'noopener,noreferrer');
      });
    </script>
  </body>
</html>
